server {
    listen 80;
    listen [::]:80;
    server_name docs.workbar.ai;

    root /srv/workbar-docs/current;
    index index.html;
    autoindex off;

    access_log /var/log/nginx/docs.workbar.ai.access.log;
    error_log  /var/log/nginx/docs.workbar.ai.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
