server {
    listen 80;
    listen [::]:80;
    server_name docs.workbar.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://docs.workbar.ai$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.workbar.ai;

    ssl_certificate     /etc/letsencrypt/live/docs.workbar.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.workbar.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WORKBAR_DOCS_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/workbar-docs/current;
    index index.html;
    autoindex off;

    access_log /var/log/nginx/docs.workbar.ai.access.log;
    error_log  /var/log/nginx/docs.workbar.ai.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    include /etc/nginx/snippets/workbar-docs-security-headers.conf;

    error_page 404 /404.html;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/workbar-docs-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/workbar-docs-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/workbar-docs-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # 只有文件名含至少 8 位十六进制内容哈希的资源才使用永久缓存。
    location ~* ^/assets/.*\.[0-9a-f]{8,}\.(?:css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/workbar-docs-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # 未带内容哈希的资源仅短期缓存，避免替换截图后长期显示旧文件。
    location ~* ^/assets/.*\.(?:css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/workbar-docs-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.html$ {
        include /etc/nginx/snippets/workbar-docs-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/workbar-docs-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }
}
